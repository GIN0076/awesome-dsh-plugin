url: https://github.com/GIN0076/dsh-token-usage
name: GIN0076/dsh-token-usage
category: usage
description:
  en: 'Token usage panel in DeepSeek Harness Settings: folds session logs into day, week and month totals per model, persisted in the plugin storage domain and served over a same-origin /token-usage-rpc route; SVG line chart with crosshair hover breaking each day down by model, a model-ranking bar chart, preset and custom start/end date ranges, and an idempotent one-click full rebuild.'
  zh: 'DSH 设置面板词元用量统计：从会话日志折叠出日/周/月 × 模型的词元统计，storage-domain 持久化、经同源 /token-usage-rpc 路由出数；SVG 折线图（十字线悬浮按日拆到每个模型）+ 模型占比柱状图 + 预设与自定义起止日期 + 幂等一键全量重建。'
